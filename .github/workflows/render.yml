name: Render Stick3D Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Nama composition di Root.tsx (kosongkan untuk pakai render-target.txt)"
        required: false
        default: ""
      frames:
        description: "Opsional: range frame (contoh: 0-120)"
        required: false
        default: ""
  push:
    branches:
      - main
      - master
    paths:
      - "engine/src/**"
      - "engine/public/**"
      - "engine/package.json"
      - "engine/package-lock.json"
      - "render-target.txt"
      - ".github/workflows/render.yml"

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine target composition
        id: target
        shell: bash
        run: |
          COMP="${{ github.event.inputs.composition }}"
          if [ -z "$COMP" ] && [ -f "render-target.txt" ]; then
            COMP=$(tr -d '[:space:]' < render-target.txt)
          fi
          if [ -z "$COMP" ]; then
            COMP="Main"
          fi
          echo "comp=$COMP" >> "$GITHUB_OUTPUT"
          echo "Rendering composition: $COMP"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "engine/package-lock.json"

      - name: Install system libraries for Chromium & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Cache Remotion headless browser
        uses: actions/cache@v4
        with:
          path: engine/node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('engine/package-lock.json') }}

      - name: Install npm dependencies
        working-directory: engine
        run: npm ci

      - name: Ensure Remotion browser
        working-directory: engine
        run: npx remotion browser ensure

      - name: Render video
        working-directory: engine
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.frames }}" ]; then
            EXTRA_ARGS="--frames=${{ github.event.inputs.frames }}"
          fi
          npx remotion render "${{ steps.target.outputs.comp }}" out.mp4 --gl=swangle --concurrency=$(nproc) $EXTRA_ARGS

      - name: Upload rendered MP4
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.target.outputs.comp }}-video
          path: engine/out.mp4
          retention-days: 7
